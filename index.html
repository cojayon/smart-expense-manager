<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Smart Expense Manager</h1>
        <p>Manage your expenses easily</p>
    </header>

    <main>

        <section class="summary">
            <div class="card">
                <h2>Total Expenses</h2>
                <p id="total-expenses">0</p>
            </div>

            <div class="card">
                <h2>Number of Expenses</h2>
                <p id="expense-count">0</p>
            </div>

            <div class="card">
                <h2>Average Expense</h2>
                <p id="average-expense">0</p>
            </div>
        </section>

        <section class="expense-form">
            <h2>Add Expense</h2>

            <input type="text" id="name" placeholder="Expense name">
            <input type="number" id="amount" placeholder="Amount">
            <input type="text" id="category" placeholder="Category">
            <input type="date" id="date">

            <button id="add-button">Add Expense</button>
        </section>

        <section class="expense-list">
            <h2>Expenses</h2>

            <input type="text" id="search" placeholder="Search expenses">
            <button id="search-button">Search</button>

            <div id="expenses-container"></div>

            <h2>Category Statistics</h2>
            <div id="category-statistics"></div>

            <canvas id="category-chart"></canvas>
        </section>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>

</body>
</html>
